name: CI/CD Pipeline & Security Scan

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-secure:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      # 1. KODU ÇEK (v4'e güncellendi)
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. NODE.JS KUR (v4'e güncellendi)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      
      - name: Install Dependencies & Run Tests
        working-directory: ./backend
        run: |
          npm ci
          npm run test

      # 3. TRIVY - GÜVENLİK TARAMASI
      - name: Run Trivy Vulnerability Scanner (FS)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

      # 4. DOCKER BUILD (v3 ve v6 sürümlerine güncellendi)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          load: true
          tags: my-geo-app:latest

      # 5. GRYPE - İMAJ TARAMASI
      - name: Scan Image with Grype
        uses: anchore/scan-action@v3
        with:
          image: "my-geo-app:latest"
          fail-build: false
          severity-cutoff: critical

      # 6. SBOM OLUŞTURMA
      - name: Generate SBOM with Syft
        uses: anchore/sbom-action@v0
        with:
          image: "my-geo-app:latest"
          format: spdx-json
          output-file: "sbom.spdx.json"
      
      # 7. SBOM KAYDETME (İşte hatayı çözen kısım: v4 oldu)
      - name: Upload SBOM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.spdx.json

      # 8. COSIGN
      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.1.1
        with:
          cosign-release: 'v2.1.1'

      - name: Check Cosign Version
        run: cosign version